<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Nail — Dashboard Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --bg: #f8fafc;
      --card: #ffffff;
      --error: #ef4444;
      --success: #22c55e;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .logo p {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-google {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-google:hover:not(:disabled) {
      background: #f1f5f9;
    }

    .btn-google svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    input[type="email"] {
      width: 100%;
      padding: 0.7rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--card);
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 0.75rem;
    }

    input[type="email"]:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .msg {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .msg.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .msg.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .msg.show { display: block; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>Mi Nail Dashboard</h1>
      <p>Sign in to view reviews &amp; drafts</p>
    </div>

    <button class="btn btn-google" id="google-btn">
      <!-- Google logo SVG -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>

    <div class="divider">or</div>

    <label for="email-input">Email address</label>
    <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email" />
    <button class="btn btn-primary" id="magic-btn">Send Magic Link</button>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    // ─── Config ────────────────────────────────────────────────────────────────
    const SUPABASE_URL  = 'https://lbsuqipqienhvgzazzur.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_vWdDSuKPHuecK_gZtCGEOA_5YUbqkeK';
    // ───────────────────────────────────────────────────────────────────────────

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // If already logged in, skip to app
    db.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = '/app.html';
    });

    function showMsg(text, isError = false) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg show ' + (isError ? 'error' : 'success');
    }

    function setLoading(id, loading, text) {
      const btn = document.getElementById(id);
      btn.disabled = loading;
      btn.textContent = loading ? text : btn.dataset.label || btn.textContent;
    }

    // Google OAuth
    const googleBtn = document.getElementById('google-btn');
    googleBtn.dataset.label = 'Sign in with Google';
    googleBtn.onclick = async () => {
      googleBtn.disabled = true;
      googleBtn.textContent = 'Redirecting...';
      const { error } = await db.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/app.html' }
      });
      if (error) {
        showMsg(error.message, true);
        googleBtn.disabled = false;
        googleBtn.innerHTML = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;flex-shrink:0"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Sign in with Google`;
      }
    };

    // Magic link
    const magicBtn = document.getElementById('magic-btn');
    magicBtn.onclick = async () => {
      const email = document.getElementById('email-input').value.trim();
      if (!email) { showMsg('Please enter your email address.', true); return; }

      magicBtn.disabled = true;
      magicBtn.textContent = 'Sending...';

      const { error } = await db.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.origin + '/app.html' }
      });

      magicBtn.disabled = false;
      magicBtn.textContent = 'Send Magic Link';

      if (error) showMsg(error.message, true);
      else showMsg('Check your email — a login link is on its way!');
    };

    // Allow Enter key in email input
    document.getElementById('email-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') magicBtn.click();
    });
  </script>
</body>
</html>
